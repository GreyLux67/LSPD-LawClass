<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LSPD Projector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #08111f;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #slide {
            width: 100vw;
            height: 100vh;
            padding: 7vh 8vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #eyebrow {
            margin: 0 0 2vh;
            color: #55b9ff;
            font-size: clamp(14px, 1.7vw, 26px);
            font-weight: bold;
            letter-spacing: 0.18em;
        }

        #title {
            margin: 0;
            font-size: clamp(42px, 7vw, 100px);
            line-height: 1;
        }

        #subtitle {
            margin: 2vh 0 4vh;
            color: #a8c5df;
            font-size: clamp(20px, 3vw, 44px);
        }

        #bullets {
            margin: 0;
            padding-left: 1.2em;
            font-size: clamp(20px, 2.6vw, 40px);
            line-height: 1.5;
        }
        #quote{
    margin-top:40px;
    padding:20px;
    border-left:6px solid #55b9ff;
    font-style:italic;
    color:#d8e8f5;
    font-size:clamp(18px,2vw,32px);
}

#scenarioBox{
    margin-top:35px;
    padding:25px;
    background:#13263b;
    border-radius:12px;
}

#scenarioBox h2{
    margin-top:0;
    color:#55b9ff;
}

#scenario{
    margin-bottom:0;
    font-size:clamp(18px,2vw,30px);
}

#warningBox{
    margin-top:30px;
    padding:25px;
    background:#4d1e1e;
    border-left:8px solid #ff4d4d;
    border-radius:12px;
}

#warningBox h2{
    margin-top:0;
    color:#ff6b6b;
}

#warning{
    margin-bottom:0;
    font-size:clamp(18px,2vw,30px);
}

        #slideNumber {
            position: fixed;
            right: 3vw;
            bottom: 3vh;
            color: #6f8ca8;
            font-size: clamp(12px, 1.3vw, 20px);
        }
    </style>
</head>

<body>

    <main id="slide">

    <p id="eyebrow"></p>

    <h1 id="title"></h1>

    <p id="subtitle"></p>

    <p id="body"></p>

    <ul id="bullets"></ul>

    <blockquote id="quote"></blockquote>

    <div id="scenarioBox">
        <h2>Scenario</h2>
        <p id="scenario"></p>
    </div>

    <div id="warningBox">
        <h2>Officer Safety</h2>
        <p id="warning"></p>
    </div>

</main>

    <div id="slideNumber"></div>

    <script src="slides.js?v=1"></script>

       <script>
function renderSlide(index){

    const slide = slides[index];

    if(!slide) return;

    document.getElementById("eyebrow").textContent =
        slide.eyebrow || "";

    document.getElementById("title").textContent =
        slide.title || "";

    document.getElementById("subtitle").textContent =
        slide.subtitle || "";

    const bullets = document.getElementById("bullets");

    bullets.innerHTML = "";

    (slide.bullets || []).forEach(function(text){

        const li = document.createElement("li");
        li.textContent = text;
        bullets.appendChild(li);

    });

    document.getElementById("slideNumber").textContent =
        "Slide " + (index + 1) + " / " + slides.length;

}

// Read ?slide= from the URL
const params = new URLSearchParams(window.location.search);

let slideNumber =
    parseInt(params.get("slide") || "1");

// Prevent invalid numbers
if (isNaN(slideNumber) || slideNumber < 1) {
    slideNumber = 1;
}

if (slideNumber > slides.length) {
    slideNumber = slides.length;
}

// Slides array starts at 0
renderSlide(slideNumber - 1);


</script>


</body>
</html>
