<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LSPD Projector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #08111f;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #slide {
            width: 100vw;
            height: 100vh;
            padding: 5vh 7vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        #eyebrow {
            margin: 0 0 1vh;
            color: #55b9ff;
            font-size: clamp(12px, 1.35vw, 22px);
            font-weight: bold;
            letter-spacing: 0.16em;
        }

        #title {
            margin: 0;
            font-size: clamp(34px, 5.5vw, 80px);
            line-height: 1;
        }

        #subtitle {
            margin: 1.2vh 0 2vh;
            color: #a8c5df;
            font-size: clamp(18px, 2.3vw, 34px);
            line-height: 1.15;
        }

        #body {
            margin: 0 0 1.5vh;
            color: #d9e6f2;
            font-size: clamp(16px, 1.75vw, 27px);
            line-height: 1.3;
            white-space: pre-line;
        }

        #bullets {
            margin: 0;
            padding-left: 1.2em;
            font-size: clamp(17px, 1.9vw, 30px);
            line-height: 1.25;
        }

        #bullets li {
            margin-bottom: 0.45vh;
        }

        #quote {
            margin: 2vh 0 0;
            padding: 1.2vh 1.5vw;
            border-left: 5px solid #55b9ff;
            background: rgba(85, 185, 255, 0.08);
            color: #d8e8f5;
            font-size: clamp(15px, 1.6vw, 25px);
            font-style: italic;
            line-height: 1.3;
        }

        #scenarioBox {
            margin-top: 2vh;
            padding: 1.6vh 1.7vw;
            background: #13263b;
            border: 1px solid #284968;
            border-radius: 10px;
        }

        #scenarioBox h2 {
            margin: 0 0 0.7vh;
            color: #55b9ff;
            font-size: clamp(16px, 1.8vw, 28px);
        }

        #scenario {
            margin: 0;
            font-size: clamp(15px, 1.65vw, 26px);
            line-height: 1.3;
        }

        #warningBox {
            margin-top: 1.5vh;
            padding: 1.5vh 1.7vw;
            background: #4d1e1e;
            border-left: 6px solid #ff4d4d;
            border-radius: 10px;
        }

        #warningBox h2 {
            margin: 0 0 0.7vh;
            color: #ff7777;
            font-size: clamp(16px, 1.8vw, 28px);
        }

        #warning {
            margin: 0;
            font-size: clamp(15px, 1.65vw, 26px);
            line-height: 1.3;
        }

        #slideImage {
            display: none;
            max-width: 100%;
            max-height: 32vh;
            margin: 2vh auto 0;
            object-fit: contain;
            border-radius: 10px;
        }

        #slideNumber {
            position: fixed;
            right: 2.5vw;
            bottom: 2vh;
            color: #7f99b2;
            font-size: clamp(11px, 1.1vw, 18px);
        }

        .hidden {
            display: none !important;
        }

        /*
            Compact mode automatically activates when a slide
            contains several content sections.
        */

        #slide.compact {
            padding-top: 3vh;
            padding-bottom: 3vh;
        }

        #slide.compact #eyebrow {
            margin-bottom: 0.6vh;
        }

        #slide.compact #title {
            font-size: clamp(30px, 4.6vw, 66px);
        }

        #slide.compact #subtitle {
            margin: 0.8vh 0 1.2vh;
            font-size: clamp(16px, 2vw, 29px);
        }

        #slide.compact #body {
            margin-bottom: 1vh;
            font-size: clamp(14px, 1.55vw, 23px);
        }

        #slide.compact #bullets {
            font-size: clamp(15px, 1.65vw, 25px);
            line-height: 1.18;
        }

        #slide.compact #quote,
        #slide.compact #scenarioBox,
        #slide.compact #warningBox {
            margin-top: 1vh;
            padding-top: 1vh;
            padding-bottom: 1vh;
        }

        #slide.compact #quote,
        #slide.compact #scenario,
        #slide.compact #warning {
            font-size: clamp(13px, 1.4vw, 21px);
        }

        #slide.compact #scenarioBox h2,
        #slide.compact #warningBox h2 {
            font-size: clamp(14px, 1.5vw, 23px);
        }
    </style>
</head>

<body>

    <main id="slide">

        <p id="eyebrow"></p>

        <h1 id="title"></h1>

        <p id="subtitle"></p>

        <p id="body"></p>

        <ul id="bullets"></ul>

        <blockquote id="quote"></blockquote>

        <div id="scenarioBox">
            <h2>Scenario</h2>
            <p id="scenario"></p>
        </div>

        <div id="warningBox">
            <h2>Officer Safety</h2>
            <p id="warning"></p>
        </div>

        <img
            id="slideImage"
            src=""
            alt="Slide image"
        >

    </main>

    <div id="slideNumber"></div>

    <script src="slides.js?v=5"></script>

    <script>
        function hasText(value) {
            return typeof value === "string" &&
                value.trim().length > 0;
        }

        function setTextElement(id, value) {
            const element = document.getElementById(id);

            if (hasText(value)) {
                element.textContent = value;
                element.classList.remove("hidden");
            } else {
                element.textContent = "";
                element.classList.add("hidden");
            }
        }

        function renderSlide(index) {
            const slide = slides[index];

            if (!slide) {
                return;
            }

            const slideElement =
                document.getElementById("slide");

            setTextElement(
                "eyebrow",
                slide.eyebrow
            );

            setTextElement(
                "title",
                slide.title
            );

            setTextElement(
                "subtitle",
                slide.subtitle
            );

            setTextElement(
                "body",
                slide.body
            );

            const bulletsElement =
                document.getElementById("bullets");

            bulletsElement.innerHTML = "";

            const validBullets =
                Array.isArray(slide.bullets)
                    ? slide.bullets.filter(hasText)
                    : [];

            if (validBullets.length > 0) {
                validBullets.forEach(function(text) {
                    const item =
                        document.createElement("li");

                    item.textContent = text;

                    bulletsElement.appendChild(item);
                });

                bulletsElement.classList.remove("hidden");
            } else {
                bulletsElement.classList.add("hidden");
            }

            setTextElement(
                "quote",
                slide.quote
            );

            const scenarioBox =
                document.getElementById("scenarioBox");

            if (hasText(slide.scenario)) {
                document.getElementById(
                    "scenario"
                ).textContent = slide.scenario;

                scenarioBox.classList.remove("hidden");
            } else {
                document.getElementById(
                    "scenario"
                ).textContent = "";

                scenarioBox.classList.add("hidden");
            }

            const warningBox =
                document.getElementById("warningBox");

            if (hasText(slide.warning)) {
                document.getElementById(
                    "warning"
                ).textContent = slide.warning;

                warningBox.classList.remove("hidden");
            } else {
                document.getElementById(
                    "warning"
                ).textContent = "";

                warningBox.classList.add("hidden");
            }

            const image =
                document.getElementById("slideImage");

            if (hasText(slide.image)) {
                image.src = slide.image;
                image.classList.remove("hidden");
                image.style.display = "block";
            } else {
                image.removeAttribute("src");
                image.classList.add("hidden");
                image.style.display = "none";
            }

            const contentSectionCount = [
                hasText(slide.body),
                validBullets.length > 0,
                hasText(slide.quote),
                hasText(slide.scenario),
                hasText(slide.warning),
                hasText(slide.image)
            ].filter(Boolean).length;

            if (
                contentSectionCount >= 4 ||
                validBullets.length >= 5
            ) {
                slideElement.classList.add("compact");
            } else {
                slideElement.classList.remove("compact");
            }

            document.getElementById(
                "slideNumber"
            ).textContent =
                "Slide " +
                (index + 1) +
                " / " +
                slides.length;
        }

        const params =
            new URLSearchParams(
                window.location.search
            );

        let slideNumber =
            parseInt(
                params.get("slide") || "1",
                10
            );

        if (
            isNaN(slideNumber) ||
            slideNumber < 1
        ) {
            slideNumber = 1;
        }

        if (slideNumber > slides.length) {
            slideNumber = slides.length;
        }

        renderSlide(slideNumber - 1);
    </script>

</body>
</html>
