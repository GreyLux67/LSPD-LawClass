<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LSPD Presenter</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #101827;
            color: white;
            padding: 40px;
        }

        h1 {
            margin-top: 0;
        }

        #currentTitle {
            font-size: 32px;
            margin: 30px 0;
            color: #58b6ff;
        }

        button {
            padding: 15px 30px;
            margin-right: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #2b82ff;
            color: white;
        }

        button:hover {
            background: #4a9cff;
        }

        #slideCount {
            margin-top: 25px;
            color: #9fb5cc;
        }

        #projectorUrl {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        .divider {
            margin: 30px 0;
            border: 0;
            border-top: 1px solid #334155;
        }
    </style>
</head>

<body>

    <h1>LSPD Academy Presenter</h1>

    <h2 id="currentTitle"></h2>

    <button onclick="previousSlide()">◀ Previous</button>
    <button onclick="nextSlide()">Next ▶</button>

    <div id="slideCount"></div>

    <hr class="divider">

    <h3>Projector URL</h3>

    <input
        id="projectorUrl"
        type="text"
        readonly
    >

    <br><br>

    <button onclick="copyProjectorUrl()">
        Copy Projector URL
    </button>

    <script src="slides.js?v=2"></script>

    <script>
        let currentSlide =
            parseInt(localStorage.getItem("currentSlide") || "0");

        if (
            currentSlide < 0 ||
            currentSlide >= slides.length
        ) {
            currentSlide = 0;
        }

        function updateDisplay() {
            document.getElementById("currentTitle").textContent =
                slides[currentSlide].title;

            document.getElementById("slideCount").textContent =
                "Slide " + (currentSlide + 1) +
                " of " + slides.length;

            const url =
                "https://greylux67.github.io/LSPD-LawClass/projector.html?slide=" +
                (currentSlide + 1);

            document.getElementById("projectorUrl").value = url;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
            }

            localStorage.setItem(
                "currentSlide",
                currentSlide
            );

            updateDisplay();
        }

        function previousSlide() {
            if (currentSlide > 0) {
                currentSlide--;
            }

            localStorage.setItem(
                "currentSlide",
                currentSlide
            );

            updateDisplay();
        }

        async function copyProjectorUrl() {
            const box =
                document.getElementById("projectorUrl");

            try {
                await navigator.clipboard.writeText(box.value);
                alert("Projector URL copied!");
            } catch (error) {
                box.select();
                document.execCommand("copy");
                alert("Projector URL copied!");
            }
        }

        updateDisplay();
    </script>

</body>
</html>
