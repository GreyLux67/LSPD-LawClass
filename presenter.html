<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD Presenter</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #101827;
            color: white;
            padding: 40px;
        }

        h1 {
            margin-top: 0;
        }

        #currentTitle {
            font-size: 32px;
            margin: 30px 0;
            color: #58b6ff;
        }

        button {
            padding: 15px 30px;
            margin-right: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #2b82ff;
            color: white;
        }

        button:hover {
            background: #4a9cff;
        }

        #slideCount {
            margin-top: 25px;
            color: #9fb5cc;
        }
    </style>
</head>
<body>

<h1>LSPD Academy Presenter</h1>

<h2 id="currentTitle"></h2>

<button onclick="previousSlide()">◀ Previous</button>
<button onclick="nextSlide()">Next ▶</button>

<div id="slideCount"></div>

<script src="slides.js?v=2"></script>

<script>

let currentSlide = 0;

function updateDisplay(){

    document.getElementById("currentTitle").textContent =
        slides[currentSlide].title;

    document.getElementById("slideCount").textContent =
        "Slide " + (currentSlide + 1) + " of " + slides.length;

}

function nextSlide(){

    if(currentSlide < slides.length - 1){
        currentSlide++;
    }

    localStorage.setItem("currentSlide", currentSlide);

    updateDisplay();

}

function previousSlide(){

    if(currentSlide > 0){
        currentSlide--;
    }

    localStorage.setItem("currentSlide", currentSlide);

    updateDisplay();

}

<hr style="margin:30px 0;">

<h3>Projector URL</h3>

<input
    id="projectorUrl"
    style="width:100%;padding:12px;font-size:16px;"
    readonly>

<br><br>

<button onclick="copyProjectorUrl()">
    Copy Projector URL
</button>
updateDisplay();
const url =
    "https://greylux67.github.io/LSPD-LawClass/projector.html?slide="
    + (currentSlide + 1);

document.getElementById("projectorUrl").value = url;

    function copyProjectorUrl(){

    const box =
        document.getElementById("projectorUrl");

    box.select();

    navigator.clipboard.writeText(box.value);

    alert("Projector URL copied!");
</script>

</body>
</html>
