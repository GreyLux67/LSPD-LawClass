<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD Academy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0d1b2a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #1b263b;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,.5);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h2 {
            color: #4da3ff;
            margin-bottom: 25px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 20px;
        }

        .button:hover {
            background: #0088ff;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>LSPD Academy</h1>
    <h2>Law Training Portal</h2>

    <p>Welcome to the Los Santos Police Department Academy.</p>

    <a href="#" class="button">Begin Training</a>
</div>

</body>
</html>
